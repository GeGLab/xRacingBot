server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/html
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2|woff|png|jpg|jpeg|gif|svg|ico|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
