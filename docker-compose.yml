version: "3.9"

services:
  api:
    build:
      context: ./api
    container_name: xracing-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in your environment or .env file}
      YOUTUBE_CHANNELS: xracing:UCW3oIxTLllTLK3Vy9jzdoEg,xracing Quedas:UCfjNkkpiOZjPnvfV1mcrwmQ
      PORT: "3000"
      YOUTUBE_CALLBACK_URL: ${YOUTUBE_CALLBACK_URL:?Set the public HTTPS webhook URL in your environment or .env file}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set a long random webhook secret in your environment or .env file}
      DATABASE_PATH: /app/data/bot.db
    volumes:
      - sqlite_data:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - xracing-net

  front:
    build:
      context: ./front
      args:
        VITE_DISCORD_CLIENT_ID: "1293240938574909440"
        VITE_SITE_URL: https://xracingnotifier.com
    container_name: xracing-front
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - xracing-net

volumes:
  sqlite_data:
    driver: local

networks:
  xracing-net:
    driver: bridge
